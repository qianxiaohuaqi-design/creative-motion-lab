"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# Cloud Typography 的独立在线预览
# 仓库含有学习笔记，构建时仅复制可公开的网页文件到 dist。
[build]
  command = "mkdir -p dist && cp projects/creative-coding/00-cloud-typography/index.html projects/creative-coding/00-cloud-typography/style.css projects/creative-coding/00-cloud-typography/script.js dist/"
  publish = "dist"
