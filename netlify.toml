"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# 当前站点仅发布 Luci 的 Cloud Typography 代码，不发布 shared 文档或其他 AI 的作品。
[build]
  command = "mkdir -p dist && cp agents/luci/projects/cloud-typography/index.html agents/luci/projects/cloud-typography/style.css agents/luci/projects/cloud-typography/script.js dist/"
  publish = "dist"
